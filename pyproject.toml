
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-cicd-demo"
version = "0.4.0"
description = "A Python project for learning CI/CD"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[tool.setuptools]
py-modules = ["app", "web_app"]
