name: Python CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff httpx build


      - name: Check code quality
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -v

  build:
    if: "!startsWith(github.ref, 'refs/tags/')"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tool
        run: python -m pip install build

      - name: Build Python package
        run: python -m build

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/
  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            pramodkumarg/python-cicd-demo:latest
            pramodkumarg/python-cicd-demo:${{ github.sha }}

  deploy-health-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render deployment
        run: sleep 60

      - name: Verify Render health endpoint
        run: |
          set -e
          for attempt in $(seq 1 10); do
            response=$(curl -sS --max-time 15 \
              -w "\n%{http_code}" \
              https://python-cicd-demo-sxo6.onrender.com/health) || true

            status_code=$(printf '%s\n' "$response" | tail -n 1)
            body=$(printf '%s\n' "$response" | sed '$d')

            if [ "$status_code" = "200" ] && \
               printf '%s' "$body" | grep -q '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "Render health check passed."
              exit 0
            fi

            echo "Attempt $attempt failed (HTTP ${status_code:-unknown}). Retrying..."
            sleep 15
          done

          echo "Render health check failed after 10 attempts."
          exit 1
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff httpx build

      - name: Check code quality
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest -v

      - name: Build Python package
        run: python -m build

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi